<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10221e"><title>L’archive scellée — Jeu d’énigmes</title><style>
:root{--bg:#0d1b19;--panel:#192d28;--line:#6c735b;--gold:#e2c58a;--cream:#f3ebd8;--muted:#bdc8bc;--good:#a5dfb6;--bad:#ffb9a5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--cream);background:var(--bg)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% -20%,#365246 0,transparent 60%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.09;background-image:repeating-linear-gradient(0deg,transparent 0 3px,#fff 4px 4px)}main{max-width:870px;margin:auto;padding:28px 17px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}.stamp{border:1px solid #8d8867;border-radius:3px;padding:7px 9px;font-size:10px;letter-spacing:.13em;transform:rotate(3deg);color:var(--gold)}h1,h2,h3{font-family:Georgia,serif;font-weight:400}h1{font-size:clamp(39px,8vw,70px);margin:22px 0 10px;line-height:1.06}h2{font-size:clamp(28px,5vw,42px);margin:9px 0 15px}h3{font-size:24px}p{line-height:1.7}button,input{font:inherit}button{background:var(--gold);color:#15221b;border:1px solid var(--gold);border-radius:7px;padding:12px 17px;cursor:pointer;font-weight:700;transition:transform .15s,filter .15s}button:hover{filter:brightness(1.1)}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}.ghost{background:transparent;color:var(--gold)}.panel{background:linear-gradient(145deg,#1c322b,#152720);border:1px solid #807c5e;border-radius:14px;padding:clamp(20px,4vw,38px);box-shadow:0 20px 55px #0006}.muted{color:var(--muted)}.gold{color:var(--gold)}.small{font-size:13px}.progress{display:flex;gap:7px;margin:24px 0}.progress span{height:5px;background:#42574b;flex:1;border-radius:20px}.progress .on{background:var(--gold)}.clue{border-left:3px solid var(--gold);background:#10231f;padding:14px 18px;margin:18px 0}.field{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}.field input{background:#0e201b;color:white;border:1px solid #a59b78;border-radius:7px;padding:12px 14px;min-width:0;flex:1;font-size:17px}.feedback{min-height:26px}.bad{color:var(--bad)}.good{color:var(--good)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}.note{background:#eee4cc;color:#28382e;padding:19px;border-radius:3px;box-shadow:2px 5px 15px #0005;transform:rotate(-1deg);font-family:Georgia,serif}.note:nth-child(even){transform:rotate(1deg)}.note b{font-size:18px}.chip{display:inline-block;border:1px solid #a89b70;color:var(--gold);border-radius:99px;padding:5px 10px;font-size:12px;margin:4px}.cipher{font-family:ui-monospace,monospace;letter-spacing:.13em;font-size:clamp(19px,4vw,30px);overflow-wrap:anywhere;text-align:center;padding:22px 8px;background:#0e201b;border:1px dashed #a89b70;border-radius:8px}.wheel{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}.wheel strong{font-size:27px;color:var(--gold)}.tilegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px auto;max-width:500px}.tile{border:1px solid #ac9a72;background:#31473c;color:#fff;min-height:70px;font:24px Georgia,serif;display:grid;place-items:center;padding:7px}.tile.selected{background:#a98b4d;color:#10231d}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.slots{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.slot{width:60px;height:65px;display:grid;place-items:center;border:1px dashed #c9b27c;border-radius:7px;font:25px Georgia,serif}.logic{overflow-x:auto}.logic table{border-collapse:collapse;width:100%;min-width:450px}.logic th,.logic td{padding:11px;border:1px solid #647768;text-align:center}.logic th{color:var(--gold);font-size:13px}.logic select{max-width:100%;background:#10231e;color:white;padding:8px;border:1px solid #a99a75;border-radius:5px}.file{padding:18px;border:1px solid #697b67;border-radius:9px;background:#11241f;margin:16px 0}.file strong{color:var(--gold)}.reveal{animation:rise .8s ease both;text-align:center;border:1px solid #e0bd7e;padding:28px 18px;background:radial-gradient(circle at top,#355444,#152821 70%);border-radius:12px}.reveal .big{font:clamp(35px,7vw,60px) Georgia,serif;color:var(--gold);margin:12px 0}.reveal .divider{height:1px;background:#9c8b68;margin:24px auto;max-width:400px}.giftline{padding:13px;border:1px solid #6d816e;border-radius:7px;margin:9px 0;text-align:left}.confetti{font-size:30px;letter-spacing:12px}.footer{margin-top:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}@media(max-width:500px){.tile{min-height:58px}.panel{padding:20px}.stamp{font-size:8px}.logic table{font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}

.puzzle{background:#0c211c;border:1px solid #627b68;border-radius:9px;padding:18px;margin:16px 0}.paper{background:#e8dfc8;color:#263b30;padding:18px;border-radius:3px;font-family:Georgia,serif;line-height:1.9}.paper b{color:#273b2b}.glyph{font-family:ui-monospace,monospace;letter-spacing:.12em;word-break:break-word}.answer{display:flex;gap:9px;flex-wrap:wrap}.answer input{flex:1;min-width:150px;padding:13px;background:#0d201b;border:1px solid #ad9d78;border-radius:7px;color:white}.tag{color:var(--gold);font-size:12px;letter-spacing:.12em;text-transform:uppercase}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.fragment{min-height:115px;text-align:left;background:#e8dfc8;color:#24372e;border:2px solid #b8a477;font:16px Georgia,serif;padding:10px}.fragment:disabled{opacity:.4}.picked{background:#183c2d;border:1px solid #d6bc80;border-radius:7px;padding:12px;margin:12px 0;min-height:50px}.hint{background:#112720;border-left:3px solid #c7a66e;padding:12px;margin:10px 0}.notice{color:#d9c99e}.mapbox{display:grid;grid-template-columns:repeat(5,1fr);max-width:360px;gap:5px}.mapbox div{border:1px solid #657f70;text-align:center;padding:10px 0;background:#254137}.logicgrid{border-collapse:collapse;width:100%;font-size:14px}.logicgrid th,.logicgrid td{border:1px solid #637869;padding:10px;text-align:left}.logicgrid th{color:var(--gold)}.cluebutton{background:#254137;color:#f5e8c9;border:1px solid #9c8b68;padding:10px}.cluebutton.active{background:#d9bc7c;color:#172b23}.codeparts{display:flex;flex-wrap:wrap;gap:8px}.codeparts span{border:1px solid #9c8b68;padding:9px 14px;border-radius:5px;color:var(--gold)}@media(max-width:500px){.grid4{grid-template-columns:repeat(2,1fr)}}@media print{body{background:white;color:black}body:before,.top,.progress,.footer,button{display:none!important}.panel,.reveal{box-shadow:none;background:white;color:black;border:0}.giftline{color:black}}
</style></head><body><main><div class="top"><span class="eyebrow">Archives privées · Transmission 008</span><span class="stamp">CONFIDENTIEL</span></div><h1>Le Dossier <span class="gold">scellé</span></h1><p class="muted">Cinq scellés. Une seule vérité.</p><div class="progress" id="progress"></div><section class="panel" id="screen" aria-live="polite"></section><div class="footer"><span class="muted small">Une expérience privée · Fonctionne hors connexion</span><button class="ghost" id="restart">↺ Recommencer</button></div></main><script>
(()=>{'use strict';
const KEY='dossier0801-expert-v4';let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch{};if(!s||!Number.isInteger(s.step))s={step:-1,hints:{},done:[],order:[],selection:[]};
const $=x=>document.querySelector(x), $$=x=>[...document.querySelectorAll(x)],save=()=>localStorage.setItem(KEY,JSON.stringify(s));
const norm=x=>String(x||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
const hints=[
['La note parle de deux alphabets : celui du texte et celui du calendrier. La bande n’a pas été mélangée.','Il s’agit d’un César. Le décalage vaut le nombre de jours d’une semaine : recule chaque lettre de sept places.'],
['Place les cartes dans un ordre qui satisfait simultanément toutes les contraintes.','Le givre touche immédiatement la fleur à sa droite ; le soleil est troisième. La feuille est dernière.'],
['Un tableau de possibilités est utile. Commence par les exclusions sur les jours, puis croise les jours et les objets.','Lina est samedi et porte la fleur. Nils est vendredi, et la clé revient à Maël dimanche.'],
['Les deux nombres d’une paire sont des coordonnées. La première désigne une ligne, la seconde une colonne.','Lis la grille de gauche à droite et de haut en bas : 32 = M. Les onze paires forment une ville du sud.'],
['Les scellés et la date retrouvée fournissent les quatre valeurs. Le code est ordonné par la gravure du coffre, pas par les numéros des scellés.','Le code final suit : jour du départ (08), nuits (02), mois (01), année (27), soit : jour de départ (2 chiffres), nombre de nuits (2 chiffres), mois (2 chiffres), puis deux derniers chiffres de l’année.']
];
const solutions=['VENDREDI HUIT','MENU','MAEL','MONTPELLIER','08020127'];
function progress(){$('#progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=s.step?'on':''}"></span>`).join('')}
function hintMarkup(){let n=s.hints[s.step]||0;return `<div class="puzzle"><button id="hint" class="ghost">${n<2?'Débloquer un indice':'Indices consultés'} (${n}/2)</button>${n?`<div class="hint">${hints[s.step][n-1]}</div>`:''}<p class="small muted">Les indices sont facultatifs, sans pénalité.</p></div>`}
function shell(label,title,intro,content){$('#screen').innerHTML=`<div class="eyebrow">${label}</div><h2>${title}</h2><p class="muted">${intro}</p>${content}${hintMarkup()}<p id="feedback" class="feedback" role="status"></p>`;const h=$('#hint');h.onclick=()=>{s.hints[s.step]=Math.min(2,(s.hints[s.step]||0)+1);save();render()}}
function error(msg='La solution ne correspond pas encore aux pièces du dossier.'){$('#feedback').innerHTML=`<span class="bad">${msg}</span>`}
function done(title,body){s.done[s.step]=true;save();$('#screen').innerHTML=`<div class="eyebrow">Scellé ${s.step+1} / 5 · Ouvert</div><h2 class="good">${title}</h2><p>${body}</p><button id="next">${s.step===4?'Découvrir le cadeau':'Passer au scellé suivant →'}</button>`;$('#next').onclick=()=>{s.step++;save();render()}}
function inputCheck(expected,callback){const check=()=>norm($('#answer').value)===norm(expected)?callback():error();$('#submit').onclick=check;$('#answer').onkeydown=e=>{if(e.key==='Enter')check()}}
function render(){progress();if(s.step===-1){$('#screen').innerHTML=`<div class="eyebrow">À l'attention de lapotitechérie</div><h2>Une archive qui ne devrait pas exister.</h2><p>Quelqu’un a laissé cinq scellés autour d’un événement à venir. Les réponses ne sont pas sur Internet : elles se trouvent dans les documents.</p><div class="cards"><div class="note"><b>Observer</b><p>Chaque détail peut compter.</p></div><div class="note"><b>Déduire</b><p>Les documents se complètent.</p></div><div class="note"><b>Déverrouiller</b><p>Garde les fragments trouvés.</p></div></div><p class="muted">Difficulté : élevée · Durée indicative : 30–50 min · Progression conservée sur cet appareil.</p><button id="start">Ouvrir le dossier →</button>`;$('#start').onclick=()=>{s.step=0;save();render()};return}
if(s.step===0){shell('Scellé I · Cryptanalyse','La lettre déplacée','Une bande de papier et une note du cryptographe. Aucun outil de décodage automatique n’est fourni.',`<div class="paper"><b>Note retrouvée :</b><br>« Sept pas séparent l’alphabet de départ de celui de l’arrivée. Chaque lettre avance ; pour rentrer, il faut revenir. »</div><div class="cipher">CLUKYLKP OBPA</div><p>Retrouve le message d’origine (deux mots).</p><div class="answer"><input id="answer" autocomplete="off" placeholder="Message déchiffré" aria-label="Message déchiffré"><button id="submit">Vérifier</button></div>`);inputCheck(solutions[0],()=>done('Une date apparaît','La première pièce indique <strong>vendredi 8</strong>. Le calendrier d’archive, daté <strong>janvier 2027</strong>, complète cette information. <span class="gold">Sceau I : 08</span>.'));return}
if(s.step===1){const pieces=[{id:'f',sym:'✿',name:'Fleur',letter:'E'},{id:'g',sym:'❄',name:'Givre',letter:'M'},{id:'l',sym:'🍂',name:'Feuille',letter:'U'},{id:'s',sym:'☀',name:'Soleil',letter:'N'}];shell('Scellé II · Herbier','Les quatre saisons','Replace les quatre cartes dans les quatre emplacements. Le verrou ne s’ouvre que lorsque toutes les contraintes sont respectées.',`<div class="paper"><b>Instructions sur l’enveloppe :</b><br>• Le givre est immédiatement avant la fleur.<br>• Le soleil n’est ni premier ni dernier.<br>• La feuille se trouve après le soleil.<br>• La fleur n’est pas dernière.<br><small>Choisis les cartes dans leur ordre de lecture. Tu peux retirer la dernière carte posée.</small></div><div class="grid4" id="pieces">${pieces.map(p=>`<button class="fragment" data-id="${p.id}" aria-label="Placer ${p.name}"><b>${p.sym} ${p.name}</b><br><span style="display:inline-block;border:2px solid #28382e;padding:3px 10px;font-size:23px;font-weight:bold">${p.letter}</span></button>`).join('')}</div><div class="picked" id="picked" aria-live="polite"></div><div class="row"><button id="undo" class="ghost">↶ Retirer la dernière</button><button id="clear" class="ghost">Tout effacer</button></div><p class="small muted">Une fois les quatre cartes placées, le verrou examine automatiquement leur ordre.</p>`);let order=Array.isArray(s.order)?s.order:[];const paint=()=>{$('#picked').textContent=order.length?'Emplacements : '+order.map((id,i)=>(i+1)+'. '+pieces.find(p=>p.id===id).name).join('  |  '):'Quatre emplacements vides — touche une carte pour la placer.';$$('[data-id]').forEach(b=>b.disabled=order.includes(b.dataset.id));$('#undo').disabled=!order.length};const validate=()=>{if(order.length!==4)return;if(order.join('')==='gfsl'){s.order=order;save();done('Le jardin a parlé','Les quatre cartes forment le mot <strong>MENU</strong> en lisant leurs lettres dans l’ordre. Ce fragment annonce une expérience culinaire.');}else{error('Une ou plusieurs contraintes ne sont pas respectées. Retire des cartes et essaie un autre ordre.')}};$$('[data-id]').forEach(b=>b.onclick=()=>{if(order.length>=4)return;order.push(b.dataset.id);s.order=order;save();paint();validate()});$('#undo').onclick=()=>{order.pop();s.order=order;save();paint();$('#feedback').textContent=''};$('#clear').onclick=()=>{order=[];s.order=[];save();paint();$('#feedback').textContent=''};paint();return}
if(s.step===2){shell('Scellé III · Déduction','La clé de la chambre','Trois personnes, trois jours et trois objets. Chaque personne est venue un jour différent, avec un objet différent. Qui possédait la clé ?',`<div class="paper">• Lina est venue après Nils, mais avant Maël.<br>• La fleur a été remise le samedi.<br>• La personne venue vendredi portait le carnet.<br>• Maël n’avait pas la fleur.<br>• Les trois jours sont vendredi, samedi et dimanche.</div><div class="logic"><table class="logicgrid"><thead><tr><th>Personne</th><th>Jour</th><th>Objet</th></tr></thead><tbody>${['Lina','Nils','Maël'].map((n,i)=>`<tr><td>${n}</td><td><select id="day${i}"><option value="">—</option><option>vendredi</option><option>samedi</option><option>dimanche</option></select></td><td><select id="obj${i}"><option value="">—</option><option>carnet</option><option>fleur</option><option>clé</option></select></td></tr>`).join('')}</tbody></table></div><p>Remplis les six cases.</p><button id="submit">Contrôler la déduction</button>`);$('#submit').onclick=()=>{const values=[0,1,2].map(i=>[$('#day'+i).value,$('#obj'+i).value]);if(JSON.stringify(values)===JSON.stringify([['samedi','fleur'],['vendredi','carnet'],['dimanche','clé']]))done('La chambre est accessible','Maël avait la clé. Elle ouvre une <strong>chambre Deluxe King Size pour deux personnes, réservée pour deux nuits</strong>. <span class="gold">Sceau III : 02</span>.');else error('Le tableau contient encore une contradiction.')};return}
if(s.step===3){const grid=['ABCDE','FGHIK','LMNOP','QRSTU','VWXYZ'];const encoded='32 34 33 44 35 15 31 31 24 15 42';shell('Scellé IV · Cartographie','Les coordonnées effacées','Un carré de vingt-cinq cases. Les chiffres représentent une ligne, puis une colonne. I et J partagent la même case.',`<div class="puzzle"><div class="mapbox">${grid.flatMap(row=>[...row].map(c=>`<div>${c}</div>`)).join('')}</div><p class="small muted">Chaque ligne contient cinq lettres. Les lignes se lisent de haut en bas, les colonnes de gauche à droite.</p></div><div class="cipher">${encoded}</div><p>Quelle ville est désignée ?</p><div class="answer"><input id="answer" autocomplete="off" placeholder="Ville"><button id="submit">Déchiffrer</button></div>`);inputCheck(solutions[3],()=>done('La destination retrouvée','La destination est <strong>Montpellier</strong>. La carte confirme le séjour du <strong>8 au 10 janvier 2027</strong>. <span class="gold">Sceau IV : 01</span> (janvier).'));return}
if(s.step===4){shell('Scellé V · Synthèse','Le coffre des archives','Le dernier verrou utilise les informations restaurées. Le code ne suit pas l’ordre des énigmes : la gravure précise exactement comment l’assembler.',`<div class="paper"><b>Gravure sur le coffre :</b><br>« Le jour du départ ouvre la marche ; le nombre de nuits suit. Puis vient le numéro du mois, et enfin les deux derniers chiffres de l’année. Écris chaque valeur sur exactement deux chiffres (avec un zéro devant si nécessaire). »</div><div class="codeparts"><span>Départ : ? ?</span><span>Durée : ? ?</span><span>Mois : ? ?</span><span>Année : ? ?</span></div><p>Code à huit chiffres :</p><div class="answer"><input id="answer" maxlength="8" inputmode="numeric" autocomplete="off" placeholder="••••••••"><button id="submit">Ouvrir</button></div>`);inputCheck(solutions[4],()=>done('Coffre ouvert','Les quatre informations s’assemblent : <strong>08 · 02 · 01 · 27</strong>. Tu peux maintenant ouvrir l’invitation.'));return}
$('#screen').innerHTML=`<div class="reveal"><div class="eyebrow">Dossier déclassifié · Invitation personnelle</div><div class="confetti">✦ ❧ ✦</div><div class="big">Une parenthèse à deux</div><p>Tu as retrouvé toutes les pièces. Maintenant, voici le vrai secret…</p><div class="divider"></div><div class="giftline">📍 <strong>Montpellier</strong><br><span class="muted">Du vendredi 8 au dimanche 10 janvier 2027</span></div><div class="giftline">🛏️ <strong>Deux nuits au Pullman La Pléiade Montpellier Centre</strong><br><span class="muted">Chambre Deluxe King Size, avec petits-déjeuners</span></div><div class="giftline">🌿 <strong>Un repas végétal chez Sensible</strong><br><span class="muted">Une expérience gastronomique à découvrir ensemble</span></div><div class="giftline">✨ <strong>Du temps pour nous</strong><br><span class="muted">Des balades, du repos et peut-être le spa sur place, à organiser si on en a envie (non réservé).</span></div><div class="divider"></div><button id="print">Imprimer l’invitation</button></div>`;$('#print').onclick=()=>window.print();
}
$('#restart').onclick=()=>{if(confirm('Effacer la progression et recommencer ?')){localStorage.removeItem(KEY);s={step:-1,hints:{},done:[],order:[]};render()}};render();
})();
</script></body></html>
